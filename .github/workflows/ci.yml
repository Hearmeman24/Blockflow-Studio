name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate custom block registry
        run: npm run gen:custom-blocks

      - name: Type-check
        run: npx tsc --noEmit

      # Lint hard-fails on errors. The React 19 `react-hooks/set-state-in-effect`
      # rule is a warning (see the justification in eslint.config.mjs);
      # warnings surface as advice without blocking.
      - name: Lint
        run: npm run lint

      - name: Test (vitest + jsdom + RTL)
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (with dev extras)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest tests/ -ra
