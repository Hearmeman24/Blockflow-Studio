[project]
name = "blockflow-studio"
version = "0.1.0b1"
description = "BlockFlow Studio: local visual pipelines for AI image and video generation with your own Kie and PiAPI keys"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "loguru>=0.7",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.6",
    "httpx>=0.27",  # for fastapi.testclient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
